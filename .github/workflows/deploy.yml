name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Give every route its own HTML file so direct links and refreshes
      # return 200 (GitHub Pages serves /identity from identity.html).
      # 404.html catches anything else, such as old /work/... links.
      - name: Route files
        run: |
          cp dist/index.html dist/404.html
          for r in universe identity process exhibition elsewhere contact brief \
                   exhibition/triscan exhibition/naadai exhibition/api-sentinel; do
            mkdir -p "dist/$(dirname "$r")"
            cp dist/index.html "dist/$r.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
